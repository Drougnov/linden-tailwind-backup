<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payout Header</title>

    <!-- poppins font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom CSS -->
    <script>
      tailwind.config = {
          darkMode: 'class',
          theme: {
              extend: {
                  screens: {
                      sm: '480px',
                      md: '768px',
                      lg: '1010px',
                      xl: '1365px',
                  },
                  fontFamily: {
                      sans: ['Poppins', 'Inter', 'Montserrat', 'Open Sans', 'arial', 'sans-serif'],
                  },
              },
          },
      }
    </script>
  </head>
  <body class="bg-white font-sans p-0 m-0 box-border overflow-y-auto overflow-x-hidden [&::-webkit-scrollbar]:hidden [-ms-order-style:none] [scrollbar-width:none] [&.dark]:bg-[#181a1b]">
    <!-- main-wrapper -->
    <div class="flex flex-col min-h-screen md:flex-row">
      <!-- dashboard-template-main -->
      <div class="w-full relative z-[2] bg-transparent before:content-[''] before:fixed before:bg-[url('https://i.ibb.co.com/Y4zzyNCR/mobile-fansocial-gradient.png')] md:before:bg-[url('https://i.ibb.co.com/spGHXsL9/desktop-fansocial-gradient.png')] before:bg-cover before:bg-center before:w-screen before:h-screen before:bg-no-repeat before:left-0 before:top-0 before:pointer-events-none">
        <div class="flex flex-col gap-4 h-full flex-grow py-2 bg-white/50 z-1 relative md:px-2 dark:bg-[#181a1b]/50">

            <!-- alert -->
            <div class="w-full border-b-[0.5px] border-b-[#EAECF0] border-l-[0.1875rem] border-l-[#22CCEE] [background:linear-gradient(0deg,rgba(34,204,238,0.15),rgba(34,204,238,0.15)),linear-gradient(0deg,rgba(255,255,255,0.9),rgba(255,255,255,0.9))] dark:border-b-[#353a3c] dark:border-l-[#0e98b4]">
                <div class="w-full h-full flex justify-between items-center gap-2.5 py-3.5 px-4 [background:linear-gradient(90deg,rgba(255,255,255,0)_0%,rgba(255,255,255,0.9)_100%)]">
                    <img src="https://i.ibb.co.com/0RnCLPjp/dollar-circle.webp" alt="dollar circle" class="w-6 h-6 [object-fit:none] [filter:brightness(0)_saturate(100%)_invert(69%)_sepia(52%)_saturate(556%)_hue-rotate(118deg)_brightness(92%)_contrast(91%)]">

                    <!-- text-content -->
                    <div class="flex flex-col flex-1 gap-1">
                        <!-- top-section -->
                        <div class="flex flex-col gap-2">
                            <h3 class="text-sm font-semibold text-[#15B79E] dark:text-[#52ebd3]">Your April payout is ready!</h3>
                        
                            <p class="text-sm text-black dark:text-[#e8e6e3]">You have made USD$234,56 in the past month, look at you! Withdraw from your available balance anytime in payout settings. </p>
                        </div>

                        <!-- bottom-section -->
                        <div class="flex justify-between">
                            <span class="text-xs leading-normal text-[#667085] dark:text-[#a0aec0]">Just now</span>
                            <button class="flex justify-center items-center gap-0.5 ">
                                <span class="text-xs leading-normal font-medium text-[#344054] dark:text-[#bdb8af]">Withdraw Now</span>
                            
                                <img src="https://i.ibb.co.com/RGNXf1Zn/arrow-up-right.webp" alt="arrow up right" class="w-4 h-4 [filter:brightness(0)_saturate(100%)_invert(22%)_sepia(11%)_saturate(1594%)_hue-rotate(179deg)_brightness(93%)_contrast(86%)]">
                            </button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
      </div>
    </div>
  </body>
</html>
